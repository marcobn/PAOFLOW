---
name: Only allow develop/patch -> master
on:
  pull_request:
    branches: [master]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Block PRs into master unless from develop or patch
        run: |
          echo "base: ${{ github.base_ref }}"
          echo "head: ${{ github.head_ref }}"
          case "${{ github.head_ref }}" in
            develop|patch) ;;
            *)
              echo "::error::PRs into 'master' must come from 'develop' or 'patch' (got '${{ github.head_ref }}')."
              exit 1
              ;;
          esac
...
