name: Notify Teams on PR merge

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-teams:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Post merge notification to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.MS_TEAMS_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'manual' }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual Teams notification test' }}
          PR_URL: ${{ github.event.pull_request.html_url || github.server_url }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login || github.actor }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "::error::Missing repository secret MS_TEAMS_WEBHOOK_URL."
            exit 1
          fi

          run_url="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"

          payload=$(jq -n \
            --arg title "!!! This is a trial run. Please ignore message!!! PR merged to $BASE_BRANCH" \
            --arg pr_title "#$PR_NUMBER $PR_TITLE" \
            --arg merged_by "$MERGED_BY" \
            --arg message "Developers: please rebase or merge the latest changes from $BASE_BRANCH into your own feature branches before continuing work." \
            --arg pr_url "$PR_URL" \
            --arg run_url "$run_url" \
            '{
              title: $title,
              prTitle: $pr_title,
              mergedBy: $merged_by,
              message: $message,
              prUrl: $pr_url,
              runUrl: $run_url
            }')

          echo "Webhook host: $(echo "$TEAMS_WEBHOOK_URL" | sed -E 's#(https://[^/]+)/.*#\1#')"

          curl --fail-with-body \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$TEAMS_WEBHOOK_URL"
