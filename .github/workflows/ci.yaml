name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit (first pass)
        continue-on-error: true
        run: |
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit and push autofixes
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply pre-commit autofixes"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Report autofix status for fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! git diff --quiet; then
            echo "Autofixable changes were found, but this PR comes from a fork so CI cannot push fixes." >> "$GITHUB_STEP_SUMMARY"
            echo "Please run 'pre-commit run --all-files' locally and push the results." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run pre-commit (verification pass)
        run: |
          pre-commit run --all-files --show-diff-on-failure

  integration-tests:
    runs-on: ubuntu-latest
    needs: pre-commit

    env:
      PAOFLOW_QE_ASSET_VERSION: integration-assets-v1
      PAOFLOW_REFERENCE_ASSET_VERSION: integration-assets-v1

      PAOFLOW_QE_ASSET_URL: https://github.com/marcobn/PAOFLOW/releases/download/integration-assets-v1/qe_assets.tar.gz
      PAOFLOW_REFERENCE_ASSET_URL: https://github.com/marcobn/PAOFLOW/releases/download/integration-assets-v1/paoflow_assets.tar.gz

      PAOFLOW_QE_ASSET_SHA256: "d41e7e69ac9a742fc9917330bbd9f297a6d3a208a8eb3537a4001bb1c4ef0f51"
      PAOFLOW_REFERENCE_ASSET_SHA256: "16b6d9bb20b3f4d0ceda1918c78ba1eac0bb3da2d73d69d252c8335b583577eb"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest matplotlib

      - name: Run QE integration tests
        run: |
          pytest tests/integration/qe -v
