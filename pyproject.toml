[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core >=3.2,<4"]

[project]
name = "PAOFLOW"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "License" }
authors = [{ name = "Marco Buongiorno Nardelli", email = "mbn@unt.edu" }]
keywords = ["DFT", "Hamiltonians", "PAO"]
dynamic = ["version", "description"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = ["numpy~=2.4", "scipy>=1.17,<2", "mpi4py~=4.1"]

[project.optional-dependencies]
weyl_search = ["z2pack", "tbmodels"]
graphics = ["vtk", "matplotlib"]
transport = ["pyyaml", "psutil", "pydantic"]
dev = ["pre-commit>=2.20.0"]

[project.urls]
Homepage = "https://github.com/marcobn/PAOFLOW"

[tool.ruff]
line-length = 100
lint.ignore = [
    "E711", # comparison to None should be 'if cond is None:'
    "E712", # comparison to True should be 'if cond is True:' or 'if cond:'
    "E722", # do not use bare except, specify exception instead
    "E731", # do not assign a lambda expression, use a def
    "E741", # ambiguous variable name 'l' (lowercase letter el)
    "F405", # name may be undefined, or defined from star imports
    "E402", # module level import not at top of file

    "F841", # local variable name ... is assigned to but never used
    "F403", # '...' may be undefined, or defined from star imports
    "F402", # module level import not at top of file
    "F811", # redefinition of unused name from line ...
]

[tool.ruff.format]
quote-style = "single"
