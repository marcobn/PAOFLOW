---
name: PAOFLOW Rust backend
on:
  push:
    branches: [ develop, main ]
    paths:
      - 'rust/paoflow_rs/**'
      - '.github/workflows/paoflow-rs.yml'
  pull_request:
    paths:
      - 'rust/paoflow_rs/**'
      - '.github/workflows/paoflow-rs.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: rust/paoflow_rs

jobs:
  test:
    name: cargo test + parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build deps
        run: python -m pip install --upgrade pip maturin numpy pytest
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        env:
          PYO3_PYTHON: python
        run: cargo clippy --all-targets -- -D warnings
      - name: Regenerate golden values
        run: python scripts/gen_golden.py
      - name: cargo test
        env:
          PYO3_PYTHON: python
        run: cargo test
      - name: Build + install extension
        run: maturin develop --release
      - name: Python parity tests
        working-directory: .
        run: python -m pytest tests/unit/acbn0 tests/unit/response -q

  wheels:
    name: Build wheels (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build abi3 wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --out dist
          working-directory: rust/paoflow_rs
      - uses: actions/upload-artifact@v4
        with:
          name: paoflow-rs-wheels-${{ matrix.os }}
          path: rust/paoflow_rs/dist/*.whl
...
