minimum_pre_commit_version: "2.20.0"

default_language_version:
  python: python3

# data kept byte for byte: the UPFs of PSEUDOS/library (up to 5 MB, the copies the examples carried)
# and the unit-test fixtures of tests/data
exclude: |
  (?x)^(?:
    BASIS/|
    examples|
    PSEUDOS/library/|
    tests/data/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        args: ["--maxkb=1400"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.3
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix", "--show-fixes"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: js-check
        name: PAOFLOW Studio JavaScript (node --check, no HTML injection)
        entry: python .github/lint/check_js.py
        language: system
        files: ^src/PAOFLOW/gui/static/js/.*\.js$
      - id: biome
        name: PAOFLOW Studio front end (Biome lint and format, biome.json)
        entry: biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: node
        additional_dependencies: ["@biomejs/biome@2.6.6"]
        files: ^src/PAOFLOW/gui/static/.*\.(js|css)$
