name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit (first pass)
        continue-on-error: true
        run: |
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit and push autofixes
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply pre-commit autofixes"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Report autofix status for fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! git diff --quiet; then
            echo "Autofixable changes were found, but this PR comes from a fork so CI cannot push fixes." >> "$GITHUB_STEP_SUMMARY"
            echo "Please run 'pre-commit run --all-files' locally and push the results." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run pre-commit (verification pass)
        run: |
          pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    runs-on: ubuntu-22.04
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        # about 2 minutes each on a laptop core; 'core' takes every folder the other two do not
        include:
          - group: solvers
            paths: tests/unit/sparse tests/unit/transport
          - group: response
            paths: tests/unit/response tests/unit/gui tests/unit/boltzmann
          - group: core
            paths: >-
              tests/unit --ignore=tests/unit/sparse --ignore=tests/unit/transport
              --ignore=tests/unit/response --ignore=tests/unit/gui --ignore=tests/unit/boltzmann
    name: unit-tests (${{ matrix.group }})
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - name: Install MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev, gui, pyskeaf, qo_analysis, thermo_optics, transport]"
          pip install matplotlib phonopy seekpath pythtb

      - name: Run unit tests (${{ matrix.group }})
        run: |
          python -m pytest ${{ matrix.paths }} -m "not slow and not integration" -q --durations=15

  projection-tests:
    # the QE saves of tests/integration/projections: PAO bands against the DFT eigenvalues of the
    # saves (projwfc.x and the internal bases), no reference outputs
    runs-on: ubuntu-22.04
    needs: pre-commit
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PAOFLOW_PROJECTION_ASSET_VERSION: integration-assets-v1
      PAOFLOW_PROJECTION_ASSET_URL: https://github.com/marcobn/PAOFLOW/releases/download/integration-assets-v1/projection_test_assets.tar.gz
      PAOFLOW_PROJECTION_ASSET_SHA256: "fe191171084b90f1212b4daa3c5bde12fd39f1bcb0a591831bcab9e75a791270"

    steps:
      - uses: actions/checkout@v4

      - name: Install MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run projection tests
        run: |
          python -m pytest tests/integration/projections -m integration -v --durations=10

  qe-integration-tests:
    runs-on: ubuntu-22.04
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        example:
          - example01
          - example02
          - example03
          - example04
          - example05
          - example06
          - example07
          - example08
          - example09
          - example10
          - example11
          - example14
          - example15
    env:
      PAOFLOW_QE_TEST_ASSET_VERSION: integration-assets-v1

      PAOFLOW_QE_TEST_ASSET_URL: https://github.com/marcobn/PAOFLOW/releases/download/integration-assets-v1/qe_test_assets.tar.gz

      PAOFLOW_QE_TEST_ASSET_SHA256: "8df1eb33fbf48d3ec18fca15310f5539b94faa51a31504eec96c58513babcd83"

    steps:
      - uses: actions/checkout@v4

      - name: Install MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev, weyl_search]"
          pip install matplotlib

      - name: Verify MPI
        run: |
          which mpirun
          mpirun --version
          python - <<'PY'
          from mpi4py import MPI
          print("MPI OK", MPI.COMM_WORLD.Get_size())
          PY

      - name: Run QE integration tests
        run: |
          TEST_ID="tests/integration/qe/test_qe_examples.py::test_qe_example[${{ matrix.example }}]"
          pytest "$TEST_ID" -v

      - name: Upload comparison plots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qe-comparison-plots-${{ matrix.example }}
          path: /tmp/pytest-of-runner/**/*.png
          if-no-files-found: ignore

  transport-integration-tests:
    runs-on: ubuntu-22.04
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        example:
          - example01
          - example02
    env:
      PAOFLOW_TRANSPORT_ASSET_VERSION: integration-assets-v1
      PAOFLOW_TRANSPORT_ASSET_URL: https://github.com/marcobn/PAOFLOW/releases/download/integration-assets-v1/transport_test_assets.tar.gz
      PAOFLOW_TRANSPORT_ASSET_SHA256: "bccba698d0e39b44a61fc650bf2fee286d06068fc5a132baf5a1088a2f95cd4c"

    steps:
      - uses: actions/checkout@v4

      - name: Install MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev, transport]"
          pip install matplotlib

      - name: Verify MPI
        run: |
          which mpirun
          mpirun --version
          python - <<'PY'
          from mpi4py import MPI
          print("MPI OK", MPI.COMM_WORLD.Get_size())
          PY

      - name: Run transport integration tests
        run: |
          TEST_ID="tests/integration/transport/test_transport_examples.py::test_transport_example[${{ matrix.example }}]"
          pytest "$TEST_ID" -v

      - name: Upload comparison plots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transport-comparison-plots-${{ matrix.example }}
          path: /tmp/pytest-of-runner/**/*.png
          if-no-files-found: ignore

  docs-page-tests:
    # shortcut: switched off until the rule for when the page tests run is decided; delete this line
    # to switch them back on
    if: false
    runs-on: ubuntu-22.04
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        # one entry per page run of tests/integration/docs/test_pages.py: each tutorial notebook
        # that runs (not in UNWRITTEN) and each how-to (its file name); "follows" checks every
        # tutorial against the driver of its base case without running it
        page:
          - follows
          - tutorial01
          - tutorial02
          - tutorial04
          - tutorial05
          - tutorial06
          - plotting
          - band-unfolding
          - unfold-large-supercells
          - twisted-bilayer
          - tight-binding-model
          - nonlinear-optics-model
          - sparse-truncation
          - sparse-states
          - quantum-oscillations

    steps:
      - uses: actions/checkout@v4

      - name: Install MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev, qo_analysis]"
          pip install matplotlib

      - name: Run the page
        run: |
          if [ "${{ matrix.page }}" = follows ]; then
            target="tests/integration/docs/test_pages.py::test_tutorial_follows_its_case"
          else
            target="tests/integration/docs/test_pages.py::test_page_runs[${{ matrix.page }}]"
          fi
          pytest "$target" -m "integration and not slow" -v --durations=0

  elphon-integration-tests:
    runs-on: ubuntu-22.04
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            paths: tests/integration/elphon/test_dfpt_coupling_parity.py tests/integration/elphon/test_irreducible_wedge.py tests/integration/elphon/test_long_range_sic.py tests/integration/elphon/test_pao_electrons_integration.py
          - group: workflows
            paths: tests/integration/elphon/test_example_workflows.py
          - group: arpes
            paths: tests/integration/elphon/test_arpes_self_energy.py
    name: elphon-integration-tests (${{ matrix.group }})
    env:
      PAOFLOW_ELPHON_ASSET_VERSION: integration-assets-v1
      PAOFLOW_ELPHON_ASSET_URL: https://github.com/marcobn/PAOFLOW/releases/download/integration-assets-v1/elphon_test_assets.tar.gz
      PAOFLOW_ELPHON_ASSET_SHA256: "2a09dbbcad7af08411d61381e608b922072ba464022fc989a69336260d6ff34b"

    steps:
      - uses: actions/checkout@v4

      - name: Install MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install matplotlib

      - name: Run electron-phonon integration tests (${{ matrix.group }})
        run: |
          pytest ${{ matrix.paths }} -m "integration and not slow" -v --durations=10
