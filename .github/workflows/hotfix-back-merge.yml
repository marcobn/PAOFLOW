---
name: Open master -> develop PR after a hotfix
on:
  pull_request:
    types: [closed]
    branches: [master]
permissions:
  contents: write
  pull-requests: write
jobs:
  back-merge:
    if: github.event.pull_request.merged && (github.head_ref == 'hotfix' || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      # Head is a throwaway branch, not master, so conflicts can be resolved on it under review.
      - name: Open back-merge PR from a sync branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          branch="sync/hotfix-$PR_NUMBER"
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$MERGE_SHA"
          gh pr create --base develop --head "$branch" \
            --title "Merge master into develop (hotfix #$PR_NUMBER)" \
            --body "Back-merge of hotfix #$PR_NUMBER.

          If there are conflicts, resolve them on \`$branch\` (web editor, or locally: \`git checkout $branch && git merge origin/develop\`, then push).

          Use a merge commit, not squash, or the next develop -> master release will be blocked."
...
