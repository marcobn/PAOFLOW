name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit (first pass)
        continue-on-error: true
        run: |
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit and push autofixes
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply pre-commit autofixes"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Report autofix status for fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! git diff --quiet; then
            echo "Autofixable changes were found, but this PR comes from a fork so CI cannot push fixes." >> "$GITHUB_STEP_SUMMARY"
            echo "Please run 'pre-commit run --all-files' locally and push the results." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run pre-commit (verification pass)
        run: |
          pre-commit run --all-files --show-diff-on-failure

  qe-integration-tests:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        example:
          - example01
          - example02
          - example03
          - example04
          - example05
          - example06
          - example07
          - example08
          - example09
          - example10
          - example11
          - example14
          - example15
    env:
      PAOFLOW_QE_TEST_ASSET_VERSION: integration-assets-v1

      PAOFLOW_QE_TEST_ASSET_URL: https://github.com/marcobn/PAOFLOW/releases/download/integration-assets-v1/qe_test_assets.tar.gz

      PAOFLOW_QE_TEST_ASSET_SHA256: "0a78bc1282197ab6496eb37c9713bff30afe819531e4bad0c7f6b0107534e7f0"

    steps:
      - uses: actions/checkout@v4

      - name: Install MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev, weyl_search]"
          pip install matplotlib

      - name: Verify MPI
        run: |
          which mpirun
          mpirun --version
          python - <<'PY'
          from mpi4py import MPI
          print("MPI OK", MPI.COMM_WORLD.Get_size())
          PY

      - name: Run QE integration tests
        run: |
          TEST_ID="tests/integration/qe/test_qe_examples.py::test_qe_example[${{ matrix.example }}]"
          pytest "$TEST_ID" -v

      - name: Upload comparison plots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qe-comparison-plots-${{ matrix.example }}
          path: /tmp/pytest-of-runner/**/*.png
          if-no-files-found: ignore

  transport-integration-tests:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        example:
          - example01
          - example02
    env:
      PAOFLOW_TRANSPORT_ASSET_VERSION: integration-assets-v1
      PAOFLOW_TRANSPORT_ASSET_URL: https://github.com/marcobn/PAOFLOW/releases/download/integration-assets-v1/transport_test_assets.tar.gz
      PAOFLOW_TRANSPORT_ASSET_SHA256: "bccba698d0e39b44a61fc650bf2fee286d06068fc5a132baf5a1088a2f95cd4c"

    steps:
      - uses: actions/checkout@v4

      - name: Install MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev, transport]"
          pip install matplotlib

      - name: Verify MPI
        run: |
          which mpirun
          mpirun --version
          python - <<'PY'
          from mpi4py import MPI
          print("MPI OK", MPI.COMM_WORLD.Get_size())
          PY

      - name: Run transport integration tests
        run: |
          TEST_ID="tests/integration/transport/test_transport_examples.py::test_transport_example[${{ matrix.example }}]"
          pytest "$TEST_ID" -v

      - name: Upload comparison plots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transport-comparison-plots-${{ matrix.example }}
          path: /tmp/pytest-of-runner/**/*.png
          if-no-files-found: ignore
