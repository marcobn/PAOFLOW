name: Upload integration assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "integration-assets-v1"

permissions:
  contents: write

jobs:
  upload-assets:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Check asset files exist
        run: |
          test -f /home/anooja/Work/software/PAOFLOW/.github/assets_generation/qe/_assets/paoflow_assets.tar.gz
          test -f /home/anooja/Work/software/PAOFLOW/.github/assets_generation/qe/_assets/qe_assets.tar.gz

      - name: Copy assets into workspace
        run: |
          cp /home/anooja/Work/software/PAOFLOW/.github/assets_generation/qe/_assets/paoflow_assets.tar.gz .
          cp /home/anooja/Work/software/PAOFLOW/.github/assets_generation/qe/_assets/qe_assets.tar.gz .
          sha256sum paoflow_assets.tar.gz qe_assets.tar.gz > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            paoflow_assets.tar.gz \
            qe_assets.tar.gz \
            SHA256SUMS \
            --title "${{ inputs.tag }}" \
            --notes "Integration-test assets" \
            || gh release upload "${{ inputs.tag }}" \
            paoflow_assets.tar.gz \
            qe_assets.tar.gz \
            SHA256SUMS \
            --clobber
