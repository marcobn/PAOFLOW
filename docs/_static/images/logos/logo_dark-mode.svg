<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PAOFLOW dark-mode glowing logo">

  <defs>
    <radialGradient id="backgroundGlow" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#113d22"/>
      <stop offset="52%" stop-color="#061a0e"/>
      <stop offset="100%" stop-color="#010904"/>
    </radialGradient>
    <linearGradient id="headerGreen" x1="220" y1="120" x2="700" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00853e"/>
      <stop offset="45%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#00853e"/>
    </linearGradient>
    <radialGradient id="orbitalGradient" cx="42%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#c7f9d8"/>
      <stop offset="35%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#00853e"/>
    </radialGradient>
    <filter id="greenGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feColorMatrix in="blur1" type="matrix"
        values="0 0 0 0 0.00
                0 0 0 0 0.52
                0 0 0 0 0.24
                0 0 0 0.75 0" result="glow"/>
      <feGaussianBlur stdDeviation="28" result="blur2"/>
      <feColorMatrix in="blur2" type="matrix"
        values="0 0 0 0 0.29
                0 0 0 0 0.87
                0 0 0 0 0.50
                0 0 0 0.35 0" result="wideGlow"/>
      <feMerge>
        <feMergeNode in="wideGlow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="900" fill="url(#backgroundGlow)"/>
  <g filter="url(#greenGlow)" transform="translate(0,20)">
    <path d="M 300 680
             L 300 300
             C 300 180 395 100 535 100
             C 690 100 790 205 790 350
             C 790 495 694 600 548 600
             L 470 600
             C 444 600 423 579 423 553
             C 423 527 444 506 470 506
             L 548 506
             C 633 506 697 445 697 350
             C 697 253 631 194 535 194
             C 456 194 393 247 393 320
             L 393 680
             C 393 706 372 727 346 727
             C 321 727 300 706 300 680 Z" fill="url(#headerGreen)"/>
    <path d="M 697 350
             C 697 445 633 506 548 506
             L 509 506
             C 570 473 604 421 604 350
             C 604 279 570 226 509 194
             L 535 194
             C 631 194 697 253 697 350 Z" fill="#052817" opacity="0.78"/>
    <circle cx="530" cy="333" r="64" fill="url(#orbitalGradient)"/>
    <circle cx="505" cy="308" r="22" fill="#c7f9d8" opacity="0.42"/>
  </g>

</svg>
